services:

  api:
    build: .                      # context = Day20/, Dockerfile copies Day20_P6/
    ports:
      - "8000:8000"
    env_file:
      - ./Day20_P6/.env           # MODEL_NAME (and other settings) for the service
    environment:
      # Inside the container "localhost" is the container itself;
      # reach the Ollama server running on the host instead.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes the name work on Linux too

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s           # agent setup (MCP + embeddings) runs at startup
