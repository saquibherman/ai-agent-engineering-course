[project]
name = "ai-agent-engineering"
version = "0.1.0"
description = "Hands-on AI agent engineering course: LLM basics, tools, MCP, RAG, memory, multi-agent systems, LangGraph, CrewAI, LangChain and FastAPI services, all on local Ollama models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core LLM clients (Ollama via its OpenAI-compatible API and native client) and config
    "openai>=2.54.0",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    # Tools: web search/scraping, HTTP, math
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "numpy>=2.5.5",
    # Model Context Protocol (fastmcp needs a matching mcp release)
    "fastmcp>=3.4.11",
    "mcp>=1.30.0",
    # Retrieval / vector stores
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    # LangChain / LangGraph track
    "langchain>=1.5.2",
    "langchain-core>=1.8.4",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.24",
    # CrewAI track
    "crewai>=1.15.44",
    # FastAPI services (Day20/Day21)
    "fastapi[standard]>=0.165.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
    "tenacity>=9.2.1",
]

[tool.uv]
# The lessons are standalone scripts run from their own folders, not an installable package.
package = false
